name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Debug generated site
        run: |
          echo "=== PUBLIC FILES ==="
          find .output/public -maxdepth 3 -type f | sort

          echo "=== INDEX ==="
          grep -a -oE '.{0,100}(fellowship-flip-cup|__TSR|location|href=|src=).{0,150}' .output/public/index.html | head -100 || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Fix GitHub Pages paths
        run: |
            find .output/public -type f -name "*.html" -exec sed -i 's|="/assets/|="/fellowship-flip-cup/assets/|g' {} +
            find .output/public -type f -name "*.html" -exec sed -i "s|='/assets/|='/fellowship-flip-cup/assets/|g" {} +

      - name: Create GitHub Pages fallback
        run: |
            cp .output/public/index.html .output/public/404.html
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.output/public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
